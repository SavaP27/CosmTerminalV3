<style>
:root{--g:#0f0;--d:#060;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#050505;color:var(--g);
font-family:Consolas,monospace;overflow:hidden;
height:100vh;display:flex;flex-direction:column;}
header{height:52px;display:flex;align-items:center;
justify-content:space-between;padding:0 8px;
border-bottom:1px solid var(--d);background:#001100;
flex-shrink:0;z-index:50;}
.hleft{display:flex;align-items:center;gap:6px;}
.logo{font-weight:bold;font-size:13px;
text-shadow:0 0 5px var(--g);}
.menu{background:transparent;border:1px solid var(--d);
color:var(--g);font-size:16px;line-height:1;
padding:6px 10px;cursor:pointer;font-family:inherit;}
.tabs{display:flex;gap:8px;}
.btn{min-width:86px;padding:12px 6px;background:transparent;
border:1px solid var(--d);color:var(--d);
font-family:inherit;font-size:13px;cursor:pointer;}
.btn.active{background:var(--g);color:#000;
border-color:var(--g);box-shadow:0 0 8px var(--g);}
#menu-panel{position:fixed;top:56px;left:8px;z-index:200;
display:none;background:#000;border:1px solid var(--g);
padding:8px;max-width:70vw;}
#menu-panel.show{display:block;}
.mi{display:block;width:100%;text-align:left;
background:transparent;border:none;
border-bottom:1px dashed #030;color:var(--g);
font-family:inherit;font-size:13px;padding:8px 6px;
cursor:pointer;}
.mi:last-child{border-bottom:none;}
#info-panel{position:fixed;top:56px;left:8px;right:8px;
bottom:8px;z-index:300;display:none;background:#000;
border:1px solid var(--g);padding:12px;
overflow-y:auto;-webkit-overflow-scrolling:touch;}
#info-panel.show{display:block;}
#info-close{margin-top:10px;background:transparent;
border:1px solid var(--g);color:var(--g);
font-family:inherit;padding:8px 14px;cursor:pointer;}
main{flex:1;position:relative;overflow:hidden;}
.view{position:absolute;top:0;left:0;width:100%;
height:100%;display:none;flex-direction:column;}
.view.active{display:flex;}
#out{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
touch-action:pan-y;padding:10px;font-size:13px;
line-height:1.4;word-break:break-word;}
#in-wrap{display:flex;align-items:center;padding:8px 10px;
border-top:1px solid var(--d);background:#000;flex-shrink:0;}
#prompt{color:var(--g);margin-right:8px;font-weight:bold;}
#cmd{flex:1;background:transparent;border:none;outline:none;
color:#fff;font-family:inherit;font-size:16px;}
#b-send{background:transparent;border:1px solid var(--d);
color:var(--g);font-size:16px;padding:6px 12px;
cursor:pointer;font-family:inherit;}
canvas{width:100%;height:100%;display:block;
touch-action:none;}
#body-tabs{position:absolute;top:8px;left:8px;z-index:6;
display:flex;gap:6px;}
.bbtn{padding:8px 12px;background:rgba(0,0,0,.7);
border:1px solid var(--d);color:var(--d);
font-family:inherit;font-size:12px;cursor:pointer;}
.bbtn.active{background:var(--g);color:#000;
border-color:var(--g);}
#legend{position:absolute;bottom:8px;left:8px;
border:1px solid var(--d);background:rgba(0,0,0,.8);
padding:6px;font-size:10px;pointer-events:none;}
#tag{position:absolute;display:none;background:#000;
border:1px solid var(--g);padding:3px 6px;font-size:11px;
color:var(--g);z-index:5;}
#tag-dot{background:transparent;border:none;color:var(--g);
font-size:14px;padding:0 4px;cursor:pointer;
font-family:inherit;}
.l-info{color:#888;}
.l-ok{color:#0f0;}
.l-err{color:#f33;}
.l-data{color:#0cf;}
.l-cmd{color:#fff;}
</style>

<script>
window.onerror=function(m,s,l){
var o=document.getElementById('out');
if(o){
var d=document.createElement('div');
d.style.color='#f33';
d.textContent='JS ERROR: '+m+' line '+l;
o.appendChild(d);
}
return false;
};
function $(id){ return document.getElementById(id); }
var out=$('out'), inp=$('cmd');
var atBottom=true;
out.addEventListener('scroll',function(){
atBottom=(out.scrollTop+out.clientHeight)>=
(out.scrollHeight-24);
});
function log(t,c){
var d=document.createElement('div');
d.className='l-'+(c||'info');
d.textContent=t;
out.appendChild(d);
if(atBottom) out.scrollTop=out.scrollHeight;
while(out.children.length>200){
out.removeChild(out.firstChild);
}
}
function fit(){
var h=window.innerHeight;
try{
if(window.visualViewport){
h=window.visualViewport.height;
}
}catch(e){}
document.body.style.height=h+'px';
window.scrollTo(0,0);
}
if(window.visualViewport){
visualViewport.addEventListener('resize',fit);
}
window.addEventListener('resize',fit);
fit();
function exec(raw){
if(typeof run==='function') run(raw);
else log('ENGINE MISSING: '+raw,'err');
}
$('b-send').addEventListener('click',function(){
exec(inp.value); inp.value=''; inp.focus();
});
inp.addEventListener('keydown',function(e){
if(e.key==='Enter'){ exec(inp.value); inp.value=''; }
});
$('in-wrap').addEventListener('click',function(){
inp.focus();
});
function switchTab(t){
var vt=$('v-term'), vg=$('v-globe');
var bt=$('b-term'), bg=$('b-globe');
if(t==='term'){
vt.classList.add('active');
vg.classList.remove('active');
bt.classList.add('active');
bg.classList.remove('active');
setTimeout(fit,50);
}else{
if(typeof initGlobe!=='function'){
log('GLOBE BLOCK MISSING','err'); return;
}
if(!initGlobe()){
log('Globe unavailable','err'); return;
}
vg.classList.add('active');
vt.classList.remove('active');
bg.classList.add('active');
bt.classList.remove('active');
setTimeout(fit,50);
}
}
$('b-term').addEventListener('click',function(){
switchTab('term');
});
$('b-globe').addEventListener('click',function(){
switchTab('globe');
});
$('menu-btn').addEventListener('click',function(e){
e.stopPropagation();
$('menu-panel').classList.toggle('show');
});
document.addEventListener('click',function(e){
var id=e.target.id;
if(id!=='menu-btn'&&id!=='menu-panel'){
$('menu-panel').classList.remove('show');
}
});
var mis=document.querySelectorAll('.mi');
Array.prototype.forEach.call(mis,function(b){
b.addEventListener('click',function(e){
e.stopPropagation();
$('menu-panel').classList.remove('show');
exec(b.getAttribute('data-c'));
});
});
$('info-close').addEventListener('click',function(){
$('info-panel').classList.remove('show');
});
$('tag-dot').addEventListener('click',function(e){
e.stopPropagation();
if(typeof openInfo==='function'&&
typeof lastTap!=='undefined'&&lastTap){
openInfo(lastTap);
}
});
log('CORE A OK','ok');
</script>

function H(s){
var x=0;
for(var i=0;i<s.length;i++){
x=(x*31+s.charCodeAt(i))%100000;
}
return x;

function CE(id,nm,tp,ic,mm,f){
var h=H(id);
DB.push({id:id,name:nm,type:tp,col:COLX[tp],body:'E',

ph:(h*7)%360*Math.PI/180,fact:f});

for(var i=0;i<n;i++){

type:tp,col:COLX[tp],body:'E',incl:ic,mm:mm,

function orbitA(s){
if(s.orb){ return BRAD[s.body]+s.orb.alt; }
var T=1440/s.mm;
var sec=T*60/(2*Math.PI);
return Math.pow(398600.4418*sec*sec,1/3);
}
function modelPos(s,date){
var T=1440/s.mm;
var t=date.getTime()/60000;
var u=2*Math.PI*((t%T)/T)+s.ph;
var i=s.incl*Math.PI/180;
var su=Math.sin(u), cu=Math.cos(u);
var lat=Math.asin(Math.sin(i)*su)*180/Math.PI;
var lon=Math.atan2(Math.cos(i)*su,cu)*180/Math.PI;
lon=lon+s.raan-0.250684*t;
lon=((lon+180)%360+360)%360-180;
var a=orbitA(s);
return {lat:lat,lon:lon,
alt:a*(1+s.e*Math.cos(u))-6371};
}

var o=s.orb;

<script>
var gCv=null,gCtx=null,gReady=false;
var yaw=0.6,pitch=0.35,zoom=1,gDrag=false;
var GRID=[],EQ=[];
var drawErrs=0;
var BODY_STYLE={
E:{line:'#005500',eq:'#00ff00',rim:'#003300'},
M:{line:'#445544',eq:'#aaffaa',rim:'#223322'},
A:{line:'#663311',eq:'#ff8844',rim:'#331100'}
};
function v3(lat,lon,r){
var la=lat*Math.PI/180, lo=lon*Math.PI/180;
return [r*Math.cos(la)*Math.cos(lo),
r*Math.sin(la),
r*Math.cos(la)*Math.sin(lo)];
}
function buildGrid(){
GRID.length=0; EQ.length=0;
var lat,lon;
for(lat=-60;lat<=60;lat+=30){
for(lon=-180;lon<180;lon+=6){
GRID.push([v3(lat,lon,1),v3(lat,lon+6,1)]);
}
}
for(lon=-180;lon<180;lon+=30){
for(lat=-90;lat<90;lat+=6){
GRID.push([v3(lat,lon,1),v3(lat+6,lon,1)]);
}
}
for(lon=-180;lon<180;lon+=4){
EQ.push([v3(0,lon,1.002),v3(0,lon+4,1.002)]);
}
}
function rot(v){
var cy=Math.cos(yaw), sy=Math.sin(yaw);
var cp=Math.cos(pitch), sp=Math.sin(pitch);
var x=v[0]*cy+v[2]*sy;
var z=-v[0]*sy+v[2]*cy;
var y2=v[1]*cp-z*sp;
var z2=v[1]*sp+z*cp;
return [x,y2,z2];
}
function proj(v){
var w=gCv.width,h=gCv.height;
var R=Math.min(w,h)*0.46*zoom;
var p=rot(v);
return {x:w/2+p[0]*R,y:h/2-p[1]*R,z:p[2]};
}

var vg=document.getElementById('v-globe');

function drawGlobe(){

gCtx.fillStyle='#050505';
gCtx.fillRect(0,0,w,h);
var R=Math.min(w,h)*0.46*zoom;
gCtx.strokeStyle=st.rim;
gCtx.beginPath();
gCtx.arc(w/2,h/2,R,0,6.2832);
gCtx.stroke();
gCtx.strokeStyle=st.line;
gCtx.beginPath();
GRID.forEach(function(seg){
var a=proj(seg[0]), b=proj(seg[1]);
if(a.z>0&&b.z>0){
gCtx.moveTo(a.x,a.y);
gCtx.lineTo(b.x,b.y);
}
});
gCtx.stroke();
gCtx.strokeStyle=st.eq;
gCtx.beginPath();
EQ.forEach(function(seg){
var a=proj(seg[0]), b=proj(seg[1]);
if(a.z>0&&b.z>0){
gCtx.moveTo(a.x,a.y);
gCtx.lineTo(b.x,b.y);
}
});
gCtx.stroke();
var now=new Date();
var vl=visibleList();
vl.forEach(function(s){
var p=getPos(s,now);
if(!p){ s._front=false; return; }
var r=1+Math.min(Math.max(p.alt,0),70000)/
BRAD[curBody];

if(s.surf) r=1.001;

('000000'+s.col.toString(16)).slice(-6);

gCtx.arc(q.x,q.y,2,0,6.2832);
gCtx.fill();
});

pts[e.pointerId]={x:e.clientX,y:e.clientY};
var n=Object.keys(pts).length;
if(n===1){
md=true; gDrag=true;
mx=e.clientX; my=e.clientY;
mt=Date.now(); moved=0;
}else if(n===2){
var ks=Object.keys(pts);
pinchD=Math.hypot(
pts[ks[0]].x-pts[ks[1]].x,
pts[ks[0]].y-pts[ks[1]].y);
md=false;
}
try{ gCv.setPointerCapture(e.pointerId); }catch(e2){}

gCv.addEventListener('pointermove',function(e){

pts[e.pointerId]={x:e.clientX,y:e.clientY};
var ks=Object.keys(pts);
if(ks.length===2){
var d=Math.hypot(
pts[ks[0]].x-pts[ks[1]].x,
pts[ks[0]].y-pts[ks[1]].y);
if(pinchD>0){
zoom*=d/pinchD;
zoom=Math.max(0.5,Math.min(4,zoom));
}
pinchD=d;
}else if(md){
yaw+=dx*0.005;
pitch+=dy*0.005;
pitch=Math.max(-1.5,Math.min(1.5,pitch));
moved+=Math.abs(dx)+Math.abs(dy);

});
function up(e){
delete pts[e.pointerId];
if(Object.keys(pts).length<2) pinchD=0;
if(Object.keys(pts).length===0){
gDrag=false;
if(md&&moved<10&&Date.now()-mt<500){
tapGlobe(e);

md=false;

gCv.addEventListener('pointercancel',up);

log('GLOBE READY','ok');

}
window.addEventListener('resize',function(){
if(gReady) gSize();
});

Math.cos(la1*Math.PI/180)*
Math.cos(la2*Math.PI/180)*
Math.sin(dLo/2)*Math.sin(dLo/2);

'border:1px solid #060;display:block;'+
'background:#000;';
img.onerror=function(){
if(wrap.parentNode)
wrap.parentNode.removeChild(wrap);
};
wrap.appendChild(img);
container.appendChild(wrap);
}).catch(function(){});
});
}
(function(){
if(window.__v3n_run) return;
window.__v3n_run=1;

run=function(raw){

<script>

st.innerHTML=

function showFiltered(img){
img.style.cssText='width:100%;max-width:340px;'+
'border:1px solid #060;display:block;'+
'filter:grayscale(1) sepia(1) hue-rotate(60deg)'+
' saturate(4) contrast(1.3) brightness(.85);';
return img;
}
function retroProcess(im,wrap){
var W=120;
var H=Math.max(20,Math.round(
im.naturalHeight/im.naturalWidth*W));
if(H>90) H=90;
var cv=document.createElement('canvas');
cv.width=W; cv.height=H;
var cx=cv.getContext('2d');
cx.drawImage(im,0,0,W,H);
var d;
try{ d=cx.getImageData(0,0,W,H); }
catch(e){ wrap.appendChild(showFiltered(im)); return; }
var px=d.data,i,x,y;
for(i=0;i<px.length;i+=4){
var lum=(px[i]*0.3+px[i+1]*0.6+px[i+2]*0.1)/255;
var lv=Math.round(lum*3)/3;
px[i]=lv*40;
px[i+1]=lv*255;
px[i+2]=lv*60;
px[i+3]=255;
}
for(y=1;y<H;y+=2){
for(x=0;x<W;x++){
var k=(y*W+x)*4;
px[k]*=0.55; px[k+1]*=0.55; px[k+2]*=0.55;
}
}
cx.putImageData(d,0,0);
cv.style.cssText='width:100%;max-width:340px;'+
'border:1px solid #060;display:block;'+
'image-rendering:pixelated;background:#000;';
wrap.appendChild(cv);
}
function loadPhotosInto(s,container){
if(typeof photoQueries!=='function') return;
photoQueries(s).forEach(function(q){
fetch('https://images-api.nasa.gov/search?q='+
encodeURIComponent(q)+'&media_type=image')
.then(function(r){
if(!r.ok) throw 0; return r.json();
}).then(function(j){
var it=j&&j.collection&&j.collection.items&&
j.collection.items[0];
if(!it||!it.links||!it.links[0]) throw 0;
var url=it.links[0].href;
url=url.replace('~medium','~small');
var wrap=document.createElement('div');
wrap.style.cssText='margin-top:10px;';
var cap=document.createElement('div');
cap.className='l-info';
cap.textContent='CAM FEED ('+q+'): ';
wrap.appendChild(cap);
container.appendChild(wrap);
var im=new Image();
im.crossOrigin='anonymous';
im.onload=function(){
try{ retroProcess(im,wrap); }
catch(e){ wrap.appendChild(showFiltered(im)); }
};
im.onerror=function(){
var im2=new Image();
im2.onload=function(){
wrap.appendChild(showFiltered(im2));
};
im2.src=url;
};
im.src=url;
}).catch(function(){});
});
}
log('V3-O CRT PHOTOS OK','ok');
</script>
<script>
function rng(x){
return function(){
x=(x*1103515245+12345)&0x7fffffff;
return x/0x7fffffff;
};
}
function limbArc(c,cx,cy,r,col){
c.strokeStyle=col;
c.beginPath();
c.arc(cx,cy,r,Math.PI*1.15,Math.PI*1.85);
c.stroke();
}
function ground(c,R,col,y){
c.strokeStyle=col;
c.beginPath();
c.moveTo(0,y);
for(var x=0;x<=320;x+=16){ c.lineTo(x,y-R()*10); }
c.stroke();
for(var k=0;k<8;k++){
var rx=R()*310, ry=y+6+R()*(170-y);
c.strokeRect(rx,ry,2+R()*5,2);
}
}
function drawRover(c,x,y){
c.strokeStyle='#0f0';
c.beginPath();
c.strokeRect(x-18,y-10,36,10);
var w=[-12,0,12];
for(var i=0;i<3;i++){
c.moveTo(x+w[i]+4,y+4);
c.arc(x+w[i],y+4,4,0,6.283);
}
c.moveTo(x+10,y-10); c.lineTo(x+10,y-20);
c.lineTo(x+16,y-20);
c.stroke();
}
function drawDish(c,x,y){
c.strokeStyle='#0f0';
c.beginPath();
c.arc(x,y,10,Math.PI*0.9,Math.PI*2.1);
c.moveTo(x,y+2); c.lineTo(x,y+14);
c.moveTo(x-14,y+14); c.lineTo(x+14,y+14);
c.stroke();
}
function drawStation(c,x,y){
c.strokeStyle='#0f0';
c.beginPath();
c.moveTo(x-40,y); c.lineTo(x+40,y);
c.strokeRect(x-10,y-5,20,10);
c.strokeRect(x-38,y-3,14,6);
c.strokeRect(x+24,y-3,14,6);
c.stroke();
}
function galaxy(c,x,y){
c.fillStyle='rgba(120,255,120,.8)';
for(var a=0;a<12.5;a+=0.18){
var r=2+a*4;
c.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r*0.6,1,1);
}
}
function clouds(c,R){
c.strokeStyle='rgba(150,255,150,.5)';
for(var k=0;k<5;k++){
var cy=115+R()*50, cx=R()*320;
c.beginPath();
c.arc(cx,cy,10+R()*20,Math.PI,0);
c.stroke();
}
}
function beams(c,R){
for(var k=0;k<4;k++){
var bx=40+R()*240;
c.strokeStyle='rgba(0,255,255,.6)';
c.beginPath(); c.moveTo(160,40); c.lineTo(bx,150);
c.stroke();
c.fillStyle='#0ff'; c.fillRect(bx-1,149,3,3);
}
}
function camScene(s){
var W=320,H=180,i,k;
var cv=document.createElement('canvas');
cv.width=W; cv.height=H;
var c=cv.getContext('2d');
var seed=0;
for(i=0;i<s.id.length;i++){
seed=(seed*31+s.id.charCodeAt(i))%99991;
}
var R=rng(seed+7);
c.fillStyle='#000'; c.fillRect(0,0,W,H);
c.fillStyle='rgba(120,255,120,.7)';
for(i=0;i<70;i++){
c.globalAlpha=0.2+R()*0.8;
c.fillRect(R()*W,R()*H*0.7,1,1);
}
c.globalAlpha=1;
var n=s.name.toUpperCase();
if(s.body==='A'){
if(s.surf){ ground(c,R,'#ff8844',130); drawRover(c,160,118); }
else { limbArc(c,160,430,300,'#ff8844');
c.fillStyle='#ff8844'; c.fillRect(250,60,3,3); }
}else if(s.body==='M'){
if(s.surf){
ground(c,R,'#aaffaa',130);
c.strokeStyle='#aaffaa';
c.beginPath(); c.arc(90,150,10,0,6.283);
c.arc(220,160,6,0,6.283); c.stroke();
}else limbArc(c,160,430,300,'#aaffaa');
}else if(n.indexOf('STARLINK')===0||
n.indexOf('KUIPER')===0||n.indexOf('ONEWEB')===0){
limbArc(c,160,400,280,'#0f0');
c.fillStyle='#0ff';
for(k=0;k<7;k++){
var an=Math.PI*1.25+k*0.08;
c.fillRect(160+Math.cos(an)*285,
400+Math.sin(an)*285,2,2);
}
}else if(s.type==='DEEP'||n.indexOf('VOYAGER')===0||
n.indexOf('PIONEER')===0){
c.fillStyle='#fff'; c.fillRect(280,30,2,2);
c.strokeStyle='rgba(255,255,255,.4)';
c.beginPath(); c.moveTo(281,31); c.lineTo(260,50);
c.stroke();
drawDish(c,120,90);
}else if(s.type==='SCI'||n.indexOf('HUBBLE')===0||
n.indexOf('JAMES')===0){
galaxy(c,210,80);
c.strokeStyle='#0f0'; c.strokeRect(90,80,40,16);
c.beginPath(); c.moveTo(130,88); c.lineTo(150,88);
c.stroke();
}else if(n.indexOf('ISS')===0||n.indexOf('TIANGONG')===0){
limbArc(c,160,420,300,'#0f0');
clouds(c,R);
drawStation(c,160,70);
}else if(s.type==='EO'||s.type==='WX'){
limbArc(c,160,420,300,'#0f0');
clouds(c,R);
c.strokeStyle='rgba(0,255,0,.35)';
c.beginPath(); c.arc(160,420,290,Math.PI*1.2,Math.PI*1.8);
c.stroke();
}else if(s.type==='NAV'||s.type==='COM'){
limbArc(c,160,420,300,'#0f0');
beams(c,R);
c.strokeStyle='#0f0'; c.strokeRect(150,50,20,10);
}else{
limbArc(c,160,420,300,'#0f0');
}
c.fillStyle='rgba(0,0,0,.35)';
for(i=0;i<H;i+=2) c.fillRect(0,i,W,1);
c.fillStyle='rgba(120,255,120,.08)';
for(i=0;i<150;i++) c.fillRect(R()*W,R()*H,1,1);
c.fillStyle='#0f0';
c.font='10px monospace';
c.fillText('CAM FEED // '+s.name,6,12);
c.fillText(new Date().toISOString().slice(0,19)+'Z',W-160,12);
c.strokeStyle='#060';
c.strokeRect(1,1,W-2,H-2);
return cv;
}
function loadPhotosInto(s,container){
var wrap=document.createElement('div');
wrap.style.cssText='margin-top:10px;';
var cap=document.createElement('div');
cap.className='l-info';
cap.textContent='CAM FEED (procedural): ';
wrap.appendChild(cap);
var cv=camScene(s);
cv.style.cssText='width:100%;max-width:340px;'+
'display:block;border:1px solid #060;'+
'image-rendering:pixelated;background:#000;';
wrap.appendChild(cv);
container.appendChild(wrap);
}
log('V3-P PROCEDURAL CAM OK','ok');
</script>
